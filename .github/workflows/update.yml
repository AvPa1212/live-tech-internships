name: Update internship list

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: internship-list-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and render
        run: python scripts/update.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/jobs.json").read_text())
          status = json.loads(Path("data/source_status.json").read_text())
          jobs = data["jobs"]
          assert data["count"] == len(jobs) >= 100
          assert len(status["sources"]) >= 10
          dated = [job["posted_at"] for job in jobs if job["posted_at"]]
          assert dated == sorted(dated, reverse=True)
          assert Path("README.md").stat().st_size < 950_000
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/source_status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh internship listings"
            git push
          fi
